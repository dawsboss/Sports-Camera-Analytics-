# Publishes web/ to GitHub Pages, so the tagger sits alongside the minutes
# app instead of only existing as a Claude artifact. Deliberately separate
# from test.yml: a red test should not block a page that is already live,
# and a page deploy should not sit in the test job's queue.
#
# Needs Settings -> Pages -> Source: GitHub Actions, once.
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
