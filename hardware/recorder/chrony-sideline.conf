# /etc/chrony/conf.d/sideline.conf on the base-station mini PC.
#
# Serve time to the cameras even with no internet at the field, so the four
# streams and the segment names share one clock. Set each camera's NTP
# server to this machine (192.168.50.2 below) and its sync interval to the
# shortest it allows.
allow 192.168.50.0/24
local stratum 8
