[project]
name = "sideline"
version = "0.1.0"
description = "Static-camera sports analytics pipeline. Veo follow-cam exports are the proof-of-concept input."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.9",
  "pyarrow>=16",
  "duckdb>=1.0",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# The API and worker are what docker-compose runs. They are optional so the
# registration core and the M1 spike install on a laptop without Redis or MinIO.
service = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "rq>=1.16",
  "redis>=5",
  "minio>=7.2",
  "psycopg[binary]>=3.1",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
sideline = "sideline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sideline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
