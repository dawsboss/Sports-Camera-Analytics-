<title>Ball Tagger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #16150F;
    --panel: #22201A;
    --raised: #2C2922;
    --line: #3A362C;
    --chalk: #F2EFE4;
    --muted: #9A9484;
    --flag: #F2603C;
    --grass: #7FA650;
    --sky: #7FA3B8;
    --shadow: 0 8px 28px rgba(0, 0, 0, .45);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  /* The tool is a dark room around a bright video frame, in every theme:
     a light chrome beside footage fights the thing you are looking at. */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--chalk);
    font-family: var(--ui); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--flag); outline-offset: 2px;
  }

  .app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- top strip ---------- */
  .top {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: none;
  }
  .mark {
    font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .mark b { color: var(--flag); font-weight: 700; }
  .top .spacer { flex: 1; }
  .counts { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .counts b { color: var(--chalk); font-weight: 600; }
  .iconbtn {
    background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .iconbtn:hover { border-color: var(--muted); }

  /* ---------- stage ---------- */
  .stagewrap {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    background: #0B0A07; display: flex; align-items: center; justify-content: center;
  }
  .zoomer {
    position: relative; width: 100%; max-height: 100%;
    transition: transform .18s ease;
    will-change: transform;
  }
  .zoomer.instant { transition: none; }
  video {
    display: block; width: 100%; height: auto; max-height: 100%;
    background: #000; touch-action: manipulation;
  }
  .marker, .ghost {
    position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border-radius: 50%; pointer-events: none;
  }
  .marker { border: 2px solid var(--flag); box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 14px rgba(242,96,60,.5); }
  .marker::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--flag);
  }
  .ghost { border: 1px dashed rgba(242,239,228,.4); width: 26px; height: 26px; margin: -13px 0 0 -13px; }
  .zoomed .marker { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-width: 1px; }
  .zoomed .marker::after { inset: 5px; }
  .zoomed .ghost { width: 10px; height: 10px; margin: -5px 0 0 -5px; }

  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(11,10,7,.82); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 16px; font-size: 13px; color: var(--chalk); pointer-events: none;
    backdrop-filter: blur(6px); text-align: center; max-width: calc(100% - 28px);
  }
  .badge {
    position: absolute; top: 10px; left: 10px;
    font-family: var(--mono); font-size: 11px; padding: 5px 9px; border-radius: 6px;
    background: rgba(11,10,7,.8); border: 1px solid var(--line); color: var(--muted);
  }
  .badge b { color: var(--chalk); font-weight: 600; }
  .zoomflag {
    position: absolute; top: 10px; right: 10px;
    font-family: var(--mono); font-size: 11px; padding: 5px 9px; border-radius: 6px;
    background: rgba(242,96,60,.16); border: 1px solid var(--flag); color: var(--flag);
  }

  /* ---------- controls ---------- */
  .controls {
    flex: none; background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 9px;
  }
  .scrub { display: flex; align-items: center; gap: 10px; }
  .scrub input[type=range] { flex: 1; accent-color: var(--flag); min-width: 0; }
  .tc { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .row { display: flex; gap: 8px; }
  .btn {
    flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--raised);
    padding: 13px 8px; font-weight: 600; font-size: 14px; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn .k {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;
  }
  .btn.primary { background: var(--flag); border-color: var(--flag); color: #1A0D08; }
  .btn.primary .k { color: #1A0D08; border-color: rgba(26,13,8,.35); }
  .btn.primary:disabled { background: var(--raised); border-color: var(--line); color: var(--chalk); }
  .btn.ghostbtn { flex: 0 0 auto; padding-inline: 14px; }
  @media (max-width: 420px) { .btn .k { display: none; } }

  /* ---------- panels ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 20; background: rgba(11,10,7,.72);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0; backdrop-filter: blur(3px);
  }
  .sheet .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 620px;
    max-height: 88%; overflow-y: auto;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
  }
  .sheet h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .sheet h3 {
    margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); font-weight: 600;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); }
  input[type=text], input[type=number], select, textarea {
    background: var(--ground); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); padding: 9px 10px; font-family: var(--mono); font-size: 13px;
    width: 100%; min-width: 0;
  }
  textarea { resize: vertical; min-height: 120px; line-height: 1.4; }
  .matchlist { display: flex; flex-direction: column; gap: 7px; }
  .matchbtn {
    text-align: left; background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; display: flex; flex-direction: column; gap: 2px;
  }
  .matchbtn:hover { border-color: var(--flag); }
  .matchbtn .n { font-weight: 600; font-size: 14px; }
  .matchbtn .d { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .stat { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .stat span:last-child { font-family: var(--mono); color: var(--chalk); }
  .stat span:first-child { color: var(--muted); }
  .note {
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
    border-left: 2px solid var(--line); padding-left: 11px; margin: 0;
  }
  .note b { color: var(--chalk); font-weight: 600; }
  .sheetrow { display: flex; gap: 8px; }
  .modeflag {
    font-family: var(--mono); font-size: 11px; color: var(--grass);
    display: flex; align-items: center; gap: 6px;
  }
  .modeflag i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--grass);
    display: inline-block; flex: none;
  }
</style>

<div class="app">
  <div class="top">
    <div class="mark">Ball<b>·</b>Tagger</div>
    <div class="spacer"></div>
    <div class="counts" id="counts">no match loaded</div>
    <button class="iconbtn" id="openMenu">Menu</button>
  </div>

  <div class="stagewrap" id="stagewrap">
    <div class="zoomer" id="zoomer">
      <video id="vid" playsinline preload="auto" muted></video>
      <div class="ghost" id="ghost" hidden></div>
      <div class="marker" id="marker" hidden></div>
    </div>
    <div class="badge" id="badge" hidden></div>
    <div class="zoomflag" id="zoomflag" hidden>zoom 4&times; · tap to adjust</div>
    <div class="hint" id="hint">Pick a match to start</div>
  </div>

  <div class="controls">
    <div class="scrub">
      <span class="tc" id="tcNow">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position in match" disabled>
      <span class="tc" id="tcEnd">0:00</span>
    </div>
    <div class="row">
      <button class="btn ghostbtn" id="btnBack" disabled title="Previous sample">&larr;</button>
      <button class="btn" id="btnNoBall" disabled>Not visible <span class="k">N</span></button>
      <button class="btn primary" id="btnNext" disabled>Save &amp; next <span class="k">space</span></button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" id="sheetCard"></div>
</div>

<script>
(function () {
  "use strict";

  // Veo serves the follow-cam cut ("standard/machine") straight from its CDN
  // with no login. A browser can play it but cannot read its pixels (no CORS
  // headers), which is all this page needs: it records where you tapped, and
  // the pipeline pulls the matching frame later from its own copy.
  var MATCHES = [
    { id: "20260919-flight", name: "19 Sept — Flight", note: "worn olive field · 67 min",
      url: "https://c.veocdn.com/2f8eec5a-ffbd-4fce-8aa5-9dfdbb6260a8/standard/machine/b296102c/video.mp4", fps: 29.97 },
    { id: "20260920-future", name: "20 Sept — Future", note: "green school field · 68 min",
      url: "https://c.veocdn.com/f1a1abd0-b054-43cd-997c-19804c2c4979/standard/machine/99b85fc1/video.mp4", fps: 29.97 }
  ];

  var SAMPLE_STEP = 0.2;   // seconds; the pipeline samples at 5 fps
  var BURST = 20;          // consecutive samples before jumping elsewhere
  var STORE = "balltagger.v1";

  var vid = document.getElementById("vid");
  var zoomer = document.getElementById("zoomer");
  var stagewrap = document.getElementById("stagewrap");
  var marker = document.getElementById("marker");
  var ghost = document.getElementById("ghost");
  var hint = document.getElementById("hint");
  var badge = document.getElementById("badge");
  var zoomflag = document.getElementById("zoomflag");
  var counts = document.getElementById("counts");
  var seek = document.getElementById("seek");
  var tcNow = document.getElementById("tcNow");
  var tcEnd = document.getElementById("tcEnd");
  var btnNext = document.getElementById("btnNext");
  var btnNoBall = document.getElementById("btnNoBall");
  var btnBack = document.getElementById("btnBack");
  var sheet = document.getElementById("sheet");
  var sheetCard = document.getElementById("sheetCard");

  var state = {
    match: null,          // the MATCHES entry in play
    labels: {},           // matchId -> { frameIndex: {x,y,vis,t} }
    pending: null,        // {x, y} tapped but not yet saved
    last: null,           // previous saved {x,y}, drawn as a ghost
    burstLeft: 0,
    zoom: false
  };

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (raw) state.labels = JSON.parse(raw) || {};
    } catch (e) { /* private window, blocked storage: run without it */ }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state.labels)); }
    catch (e) { /* out of quota or blocked: the copy-out in the menu still works */ }
  }
  function bag() {
    if (!state.match) return {};
    if (!state.labels[state.match.id]) state.labels[state.match.id] = {};
    return state.labels[state.match.id];
  }
  function tally(id) {
    var b = state.labels[id] || {}, seen = 0, vis = 0;
    for (var k in b) { if (Object.prototype.hasOwnProperty.call(b, k)) { seen++; if (b[k].vis) vis++; } }
    return { seen: seen, vis: vis };
  }

  /* ---------- time and frames ---------- */
  function fps() { return (state.match && state.match.fps) || 29.97; }
  function frameOf(t) { return Math.round(t * fps()); }
  function mmss(t) {
    if (!isFinite(t)) return "0:00";
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* ---------- rendering ---------- */
  function draw() {
    var p = state.pending;
    marker.hidden = !p;
    if (p) { marker.style.left = (p.x * 100) + "%"; marker.style.top = (p.y * 100) + "%"; }
    var g = state.last;
    ghost.hidden = !g || !!p;
    if (g && !p) { ghost.style.left = (g.x * 100) + "%"; ghost.style.top = (g.y * 100) + "%"; }

    btnNext.disabled = !p;
    btnNoBall.disabled = !state.match;
    btnBack.disabled = !state.match || vid.currentTime < SAMPLE_STEP;

    if (!state.match) { hint.textContent = "Pick a match to start"; hint.hidden = false; }
    else if (p) { hint.hidden = true; }
    else { hint.textContent = state.last ? "Tap the ball — dashed ring is where it was" : "Tap the ball"; hint.hidden = false; }

    if (state.match) {
      var t = tally(state.match.id);
      counts.innerHTML = "<b>" + t.seen + "</b> tagged · " + t.vis + " with ball";
      badge.hidden = false;
      badge.innerHTML = "frame <b>" + frameOf(vid.currentTime) + "</b> · burst " + (BURST - state.burstLeft + 1) + "/" + BURST;
    }
    zoomflag.hidden = !state.zoom;
  }

  function setZoom(on, x, y) {
    state.zoom = on;
    zoomer.classList.toggle("zoomed", on);
    stagewrap.classList.toggle("zoomed", on);
    if (on) {
      zoomer.style.transformOrigin = (x * 100) + "% " + (y * 100) + "%";
      zoomer.style.transform = "scale(4)";
    } else {
      zoomer.style.transform = "none";
    }
    draw();
  }

  /* ---------- tapping ---------- */
  // offsetX/Y are in the element's own untransformed coordinate space, so the
  // CSS zoom above needs no correction here. The video box is set to the
  // frame's exact aspect ratio, so there is no letterboxing to subtract.
  vid.addEventListener("pointerdown", function (e) {
    if (!state.match) return;
    var w = vid.clientWidth, h = vid.clientHeight;
    if (!w || !h) return;
    var x = Math.min(1, Math.max(0, e.offsetX / w));
    var y = Math.min(1, Math.max(0, e.offsetY / h));
    state.pending = { x: x, y: y };
    if (!state.zoom) setZoom(true, x, y); else draw();
  });

  /* ---------- the work loop ---------- */
  function seekTo(t, then) {
    var dur = vid.duration || 0;
    t = Math.max(0, Math.min(dur ? dur - 0.05 : t, t));
    var done = function () { vid.removeEventListener("seeked", done); syncScrub(); if (then) then(); };
    vid.addEventListener("seeked", done);
    vid.currentTime = t;
  }

  function syncScrub() {
    var dur = vid.duration || 0;
    if (dur) {
      seek.value = String(Math.round((vid.currentTime / dur) * 1000));
      tcNow.textContent = mmss(vid.currentTime);
      tcEnd.textContent = mmss(dur);
    }
    draw();
  }

  function commit(visible) {
    if (!state.match) return;
    var f = frameOf(vid.currentTime);
    var rec = visible
      ? { x: round4(state.pending.x), y: round4(state.pending.y), vis: 1, t: Math.round(vid.currentTime * 1000) }
      : { vis: 0, t: Math.round(vid.currentTime * 1000) };
    bag()[f] = rec;
    save();
    state.last = visible ? { x: state.pending.x, y: state.pending.y } : state.last;
    state.pending = null;
    setZoom(false);
    advance();
  }
  function round4(v) { return Math.round(v * 10000) / 10000; }

  function advance() {
    state.burstLeft--;
    if (state.burstLeft <= 0) { jumpToNewBurst(); return; }
    seekTo(vid.currentTime + SAMPLE_STEP);
  }

  // Bursts of consecutive samples, spread over the match. Consecutive frames
  // are what a ball detector has to learn from, and labelling them in a run
  // also shows how far the ball travels between samples.
  function jumpToNewBurst() {
    var dur = vid.duration || 0;
    state.burstLeft = BURST;
    state.last = null;
    if (!dur) return;
    var b = bag();
    for (var i = 0; i < 40; i++) {
      var t = 60 + Math.random() * Math.max(1, dur - 120 - BURST * SAMPLE_STEP);
      if (!b[frameOf(t)]) { seekTo(t); return; }
    }
    seekTo(60 + Math.random() * Math.max(1, dur - 120));
  }

  btnNext.addEventListener("click", function () { if (state.pending) commit(true); });
  btnNoBall.addEventListener("click", function () { commit(false); });
  btnBack.addEventListener("click", function () {
    state.pending = null; setZoom(false);
    seekTo(vid.currentTime - SAMPLE_STEP);
  });
  seek.addEventListener("input", function () {
    var dur = vid.duration || 0;
    if (!dur) return;
    state.pending = null; state.last = null; setZoom(false);
    seekTo((Number(seek.value) / 1000) * dur);
  });

  document.addEventListener("keydown", function (e) {
    if (sheet.hidden === false) { if (e.key === "Escape") closeSheet(); return; }
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === " ") { e.preventDefault(); if (state.pending) commit(true); }
    else if (e.key === "n" || e.key === "N") { e.preventDefault(); if (state.match) commit(false); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); btnBack.click(); }
    else if (e.key === "z" || e.key === "Z") { if (state.pending) setZoom(!state.zoom, state.pending.x, state.pending.y); }
  });

  /* ---------- loading a match ---------- */
  function openMatch(m) {
    state.match = m;
    state.pending = null; state.last = null; state.burstLeft = BURST;
    setZoom(false);
    vid.src = m.url;
    seek.disabled = false;
    hint.textContent = "Loading video…"; hint.hidden = false;
    vid.addEventListener("loadedmetadata", function onMeta() {
      vid.removeEventListener("loadedmetadata", onMeta);
      if (vid.videoWidth && vid.videoHeight) {
        vid.style.aspectRatio = vid.videoWidth + " / " + vid.videoHeight;
      }
      jumpToNewBurst();
      draw();
    });
    vid.addEventListener("error", function onErr() {
      vid.removeEventListener("error", onErr);
      hint.textContent = "Video would not load — check the link in the menu";
      hint.hidden = false;
    });
    closeSheet();
    draw();
  }

  /* ---------- menu ---------- */
  function closeSheet() { sheet.hidden = true; sheetCard.innerHTML = ""; }
  sheet.addEventListener("pointerdown", function (e) { if (e.target === sheet) closeSheet(); });
  document.getElementById("openMenu").addEventListener("click", openSheet);

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function openSheet() {
    sheetCard.innerHTML = "";
    sheet.hidden = false;

    var head = el("div", "sheetrow");
    head.style.alignItems = "center";
    var h = el("h2", null, "Ball Tagger");
    h.style.flex = "1";
    head.appendChild(h);
    var close = el("button", "iconbtn", "Close");
    close.addEventListener("click", closeSheet);
    head.appendChild(close);
    sheetCard.appendChild(head);

    var mode = el("div", "modeflag");
    mode.appendChild(el("i"));
    mode.appendChild(el("span", null, "Saved on this device. Copy the tags out below when you are done."));
    sheetCard.appendChild(mode);

    // matches
    sheetCard.appendChild(el("h3", null, "Match"));
    var list = el("div", "matchlist");
    MATCHES.forEach(function (m) {
      var t = tally(m.id);
      var b = el("button", "matchbtn");
      b.appendChild(el("span", "n", m.name + (state.match && state.match.id === m.id ? "  ·  open" : "")));
      b.appendChild(el("span", "d", m.note + " · " + t.seen + " tagged"));
      b.addEventListener("click", function () { openMatch(m); });
      list.appendChild(b);
    });
    sheetCard.appendChild(list);

    // custom URL
    var f = el("div", "field");
    f.appendChild(el("label", null, "Or a direct video link (…veocdn.com/…/video.mp4)"));
    var input = el("input");
    input.type = "text";
    input.id = "customUrl";
    input.placeholder = "https://c.veocdn.com/…/video.mp4";
    f.appendChild(input);
    var go = el("button", "btn", "Open this link");
    go.addEventListener("click", function () {
      var u = input.value.trim();
      if (!u) return;
      openMatch({ id: "custom-" + u.slice(-40), name: "Custom", note: u, url: u, fps: 29.97 });
    });
    f.appendChild(go);
    sheetCard.appendChild(f);

    var note = el("p", "note");
    note.innerHTML = "A Veo <b>match page</b> link will not work here — the page needs the direct video file. "
      + "Send Claude the match link and it will be added to the list above.";
    sheetCard.appendChild(note);

    // progress
    if (state.match) {
      sheetCard.appendChild(el("h3", null, "This match"));
      var t2 = tally(state.match.id);
      [["Frames tagged", t2.seen], ["Ball visible", t2.vis], ["Ball not visible", t2.seen - t2.vis]]
        .forEach(function (row) {
          var s = el("div", "stat");
          s.appendChild(el("span", null, row[0]));
          s.appendChild(el("span", null, String(row[1])));
          sheetCard.appendChild(s);
        });
    }

    // export
    sheetCard.appendChild(el("h3", null, "Tags"));
    var out = el("textarea");
    out.id = "exportBox";
    out.readOnly = true;
    out.value = JSON.stringify({ version: 1, sampleStep: SAMPLE_STEP, matches: state.labels }, null, 1);
    sheetCard.appendChild(out);

    var row = el("div", "sheetrow");
    var copy = el("button", "btn primary", "Copy tags");
    copy.addEventListener("click", function () {
      out.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(out.value).then(function () {
          copy.textContent = "Copied";
          setTimeout(function () { copy.textContent = "Copy tags"; }, 1400);
        }, function () {
          copy.textContent = ok ? "Copied" : "Select and copy";
          setTimeout(function () { copy.textContent = "Copy tags"; }, 1800);
        });
      } else {
        copy.textContent = ok ? "Copied" : "Select and copy";
        setTimeout(function () { copy.textContent = "Copy tags"; }, 1800);
      }
    });
    row.appendChild(copy);
    var clear = el("button", "btn", "Clear this match");
    clear.addEventListener("click", function () {
      if (!state.match) return;
      if (clear.dataset.armed !== "1") {
        clear.dataset.armed = "1"; clear.textContent = "Tap again to clear";
        setTimeout(function () { clear.dataset.armed = "0"; clear.textContent = "Clear this match"; }, 3000);
        return;
      }
      delete state.labels[state.match.id];
      save(); openSheet();
    });
    row.appendChild(clear);
    sheetCard.appendChild(row);

    var note2 = el("p", "note");
    note2.innerHTML = "<b>How it goes.</b> Twenty frames in a row, a fifth of a second apart, then it jumps somewhere "
      + "new in the match. Tap the ball and the frame zooms so you can check it, then <b>Save &amp; next</b>. "
      + "If the ball is off screen or hidden, <b>Not visible</b> — those count just as much.";
    sheetCard.appendChild(note2);
  }

  /* ---------- go ---------- */
  load();
  vid.addEventListener("timeupdate", syncScrub);
  vid.addEventListener("durationchange", syncScrub);
  draw();
  openSheet();
})();
</script>
