<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16150F">
<title>Sideline Review</title>
<style>
  /* The same dark room as the tagger: a bright frame, quiet chrome. */
  :root {
    --ground: #16150F; --panel: #22201A; --raised: #2C2922; --line: #3A362C;
    --chalk: #F2EFE4; --muted: #9A9484; --flag: #F2603C; --grass: #7FA650; --sky: #7FA3B8;
    --ok: #7FA650; --bad: #F2603C; --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ui: system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--chalk); font-family: var(--ui); font-size: 15px; line-height: 1.4; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--grass); color: #10140A; border-color: transparent; font-weight: 600; }
  button.danger { background: var(--bad); color: #fff; border-color: transparent; }
  button.on { outline: 2px solid var(--flag); }
  select, input { font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .app { height: 100%; display: grid; grid-template-columns: 300px 1fr; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .list { max-height: 44vh; } .scrub { flex-wrap: wrap; } .scrub .t { min-width: 0; flex-basis: 100%; text-align: left; } }
  .list { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  .list header { padding: 14px 14px 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .list header small { color: var(--muted); font-weight: 400; }
  .list .top { position: sticky; top: 0; z-index: 1; background: var(--panel); }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
  .chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .chip small { margin-left: 5px; font-family: var(--mono); color: var(--muted); }
  .chip.on { background: var(--chalk); color: var(--ground); border-color: transparent; font-weight: 600; }
  .chip.on small { color: inherit; }
  .ev { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; align-items: center; color: inherit; text-decoration: none; }
  .ev:hover { background: var(--raised); }
  .ev.sel { background: var(--raised); box-shadow: inset 3px 0 var(--flag); }
  .ev .clock { font-family: var(--mono); color: var(--muted); }
  .ev .kind { font-weight: 600; }
  .ev .who { color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.right { color: var(--ok); border-color: var(--ok); }
  .badge.wrong_type, .badge.wrong_taker { color: var(--flag); border-color: var(--flag); }
  .badge.not_event { color: var(--muted); text-decoration: line-through; }
  .badge.carried { border-style: dashed; }
  /* The kind buttons wrap with the other verdict buttons, as items of the same row. */
  .kindbtns { display: contents; }
  .kindbtns button { padding: 8px 10px; }
  .kindbtns button.on { outline: 2px solid var(--sky); }
  .kindbtns kbd { margin-right: 5px; }
  .stage { display: flex; flex-direction: column; min-width: 0; }
  .frame { position: relative; background: #000; flex: 1; min-height: 240px; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; display: block; }
  .caption { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px; background: rgba(20,20,20,.78); display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .caption b { font-size: 17px; }
  .caption .why { color: var(--muted); font-size: 13px; }
  .caption .conf { font-family: var(--mono); color: var(--sky); }
  .hint { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px; background: rgba(242,96,60,.85); color: #fff; font-weight: 600; }
  .scrub { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  .scrub input[type=range] { flex: 1; min-width: 60px; }
  .scrub .t { font-family: var(--mono); color: var(--muted); min-width: 110px; text-align: right; }
  .verdicts { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px 14px; background: var(--panel); align-items: center; }
  .verdicts .sp { flex: 1; }
  .verdicts .who { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .empty { padding: 40px; color: var(--muted); text-align: center; }
  .add { padding: 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .add h3 { font-size: 15px; }
  .add label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  .add input, .add select { width: 100%; }
  .add .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .add .check { display: flex; gap: 8px; align-items: flex-start; color: var(--chalk); }
  .add .check input { width: auto; margin-top: 3px; }
  .add progress { width: 100%; height: 8px; }
  .add .err { color: var(--bad); font-size: 13px; }
  .status { font-size: 12px; color: var(--muted); }
  .ev .act { font-size: 12px; padding: 4px 8px; }
  .status.failed { color: var(--bad); }
  .status.ready { color: var(--ok); }
  kbd { font-family: var(--mono); font-size: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="list">
    <div class="top" id="top">
      <header><span>Events <small id="count"></small></span><small id="matchid"></small></header>
      <div id="kinds" class="kinds" hidden></div>
    </div>
    <div id="events"></div>
    <div id="empty" class="empty" hidden></div>
    <form id="add" class="add" hidden>
      <h3>Add film</h3>
      <label>Video file<input type="file" id="f_file" accept="video/*"></label>
      <label>or a direct link to the video file<input type="url" id="f_url" placeholder="https://…/match.mp4"></label>
      <div class="two">
        <label>First whistle, into the video<input type="text" id="f_kick" placeholder="mm:ss" pattern="^\d{1,3}:\d{2}$"></label>
        <label>Camera<select id="f_mode"><option value="followcam">Veo follow-cam</option><option value="static">fixed camera</option></select></label>
      </div>
      <div class="two">
        <label>Pitch length, m<input type="number" id="f_len" value="105" step="0.5" min="30"></label>
        <label>Pitch width, m<input type="number" id="f_wid" value="68" step="0.5" min="20"></label>
      </div>
      <label>Minutes-app game id (optional)<input type="text" id="f_sm" placeholder="matches/… id"></label>
      <label class="check"><input type="checkbox" id="f_detect"><span>Also find the players, the ball and the restarts here. Needs the detector model and takes hours without a GPU; leave off to do that step on the GPU machine.</span></label>
      <button class="primary" id="f_go" type="submit">Add</button>
      <progress id="f_prog" value="0" max="100" hidden></progress>
      <div class="status" id="f_note" hidden></div>
      <div class="err" id="f_err" hidden></div>
    </form>
  </aside>
  <main class="stage">
    <div class="frame">
      <canvas id="c" width="16" height="9"></canvas>
      <div class="caption" id="caption" hidden></div>
      <div class="hint" id="hint" hidden>Tap the player who actually took it</div>
    </div>
    <div class="scrub">
      <button id="play" title="space">▶</button>
      <button id="earlier" title="[  five seconds more before">◀ 5 s</button>
      <input type="range" id="scrubber" min="0" max="0" value="0" step="1">
      <button id="later" title="]  five seconds more after">5 s ▶</button>
      <span class="t" id="time"></span>
    </div>
    <div class="verdicts">
      <button class="primary" id="right" title="1">✓ Right</button>
      <span class="kindbtns" id="kindbtns"></span>
      <button id="wrongtaker" title="click a box">Wrong taker</button>
      <button class="danger" id="notevent" title="0">Not an event</button>
      <span class="sp"></span>
      <span class="who">
        <select id="roster" hidden></select>
        <button id="name" hidden>Name the taker</button>
        <input id="by" placeholder="your name" size="10">
      </span>
    </div>
    <div class="verdicts" style="padding-top:0;color:var(--muted);font-size:13px">
      <span style="color:#FFDC00">■</span> took this event &nbsp; <span style="color:#5BE37D">■</span> has the ball now &nbsp; <kbd>j</kbd>/<kbd>k</kbd> next / previous event shown &nbsp; <kbd>←</kbd>/<kbd>→</kbd> step frames &nbsp; <kbd>space</kbd> play &nbsp; <kbd>[</kbd>/<kbd>]</kbd> longer clip &nbsp; <kbd>1</kbd> right &nbsp; <kbd>2</kbd>… what it was &nbsp; <kbd>0</kbd> not an event
    </div>
  </main>
</div>
<script>
/* The review page: play the match at each event the pipeline wrote, draw
   what the stages saw, and take one of four taps. Every tap is a row on the
   API, never an edit to the artifact. Served by the Sideline API on your own
   network; it reaches nothing else. */
(() => {
  const qs = new URLSearchParams(location.search);
  const matchId = qs.get('match');
  const $ = id => document.getElementById(id);
  // Roster names, verdict kinds and reasons are free text from the API's
  // database; nothing from them is ever interpreted as markup.
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const state = { doc: null, i: -1, frames: [], f: 0, images: new Map(), playing: null, pickTaker: false, kinds: {}, filter: qs.get('kind') || null };
  $('by').value = localStorage.getItem('sideline.review.by') || '';
  $('by').addEventListener('change', () => localStorage.setItem('sideline.review.by', $('by').value));
  const by = () => $('by').value.trim() || 'coach';

  async function api(path, opts) {
    const r = await fetch(path, opts);
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    return r.json();
  }
  function fail(msg) {
    $('empty').hidden = false; $('empty').textContent = msg;
  }
  if (!matchId) {
    // No match named: the landing page. It lists the matches this API
    // knows, newest first, with where each one has got to, and takes new
    // film: a file, or a direct link the server fetches. The stages run in
    // the background; the list polls while any job is still going.
    const STAGE_WORDS = { fetch: 'fetching the video', s0_ingest: 'ingesting', s1_sampling: 'sampling frames',
                          s2_detection: 'finding players and the ball', s3_tracking: 'tracking', s8_events: 'finding restarts' };
    function statusOf(m) {
      const jobs = m.jobs || [];
      const failed = jobs.find(j => j.status === 'failed');
      if (failed) return { cls: 'failed', text: `${STAGE_WORDS[failed.stage] || failed.stage} failed: ${(failed.error || '').slice(0, 120)}` };
      const running = jobs.find(j => j.status === 'running');
      if (running) {
        const pct = running.progress != null ? ` ${Math.round(running.progress * 100)}%` : '';
        const step = jobs.indexOf(running) + 1;
        return { cls: 'busy', text: `step ${step} of ${jobs.length}: ${running.detail || STAGE_WORDS[running.stage] || running.stage}${pct}` };
      }
      const queued = jobs.find(j => j.status === 'queued');
      if (queued) return { cls: 'busy', text: `waiting to start: ${STAGE_WORDS[queued.stage] || queued.stage}` };
      const a = m.artifacts || {};
      if (a.s8_events && a.s8_events.length) return { cls: 'ready', text: `ready to review · events v${Math.max(...a.s8_events)}`, canRun: true };
      if (a.s1_sampling && a.s1_sampling.length) return { cls: '', text: 'sampled; detection not run yet', canRun: true };
      if (!jobs.length && !m.source_url) return { cls: '', text: 'waiting for its video' };
      return { cls: '', text: 'nothing run yet' };
    }
    async function runHere(id, label) {
      const r = await fetch(`/matches/${encodeURIComponent(id)}/jobs`, { method: 'POST' });
      if (!r.ok) { alert(`${label} did not start: ${r.status} ${(await r.text()).slice(0, 200)}`); return; }
      refresh().catch(() => {});
    }
    const gb = n => `${(n / 1e9).toFixed(2)} GB`;
    let timer = null;
    async function refresh() {
      const list = await api('/matches');
      const el = $('events'); el.innerHTML = '';
      $('count').textContent = `${list.length} match${list.length === 1 ? '' : 'es'}`;
      $('matchid').textContent = '';
      $('add').hidden = false;
      if (!list.length) { $('empty').hidden = false; $('empty').textContent = 'No matches on this server yet. Add film below.'; }
      else { $('empty').hidden = false; $('empty').textContent = 'Pick a match on the left, or add film below.'; }
      let busy = false;
      for (const m of list) {
        const st = statusOf(m);
        busy = busy || st.cls === 'busy';
        const a = document.createElement('a');
        a.className = 'ev'; a.href = `/review?match=${encodeURIComponent(m.id)}`;
        a.innerHTML = `<span class="clock">${esc(m.id.slice(0, 6))}</span><span><div class="kind">${esc(m.original_filename || m.id)}</div><div class="status ${esc(st.cls)}">${esc(m.capture_mode)} · ${esc(st.text)}</div></span><span class="badge">${st.cls === 'ready' ? 'review' : 'open'}</span>`;
        if (st.canRun && st.cls !== 'busy') {
          // Detection, tracking and restarts on this server; a re-run makes
          // new versions and never touches the old ones.
          const b = document.createElement('button');
          b.className = 'act'; b.type = 'button';
          b.textContent = st.cls === 'ready' ? 'Run detection again' : 'Run detection here';
          b.title = 'Find the players, the ball and the restarts on this server (needs the worker and its GPU; slow without)';
          b.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); b.disabled = true; runHere(m.id, b.textContent); });
          a.querySelector('span:nth-child(2)').appendChild(b);
        }
        el.appendChild(a);
      }
      clearTimeout(timer);
      if (busy) timer = setTimeout(() => refresh().catch(() => {}), 3000);
    }
    refresh().catch(err => fail(`Could not list matches: ${err.message}. Is this page served by the Sideline API (sideline serve) on your network?`));

    $('add').addEventListener('submit', ev => {
      ev.preventDefault();
      const file = $('f_file').files[0], url = $('f_url').value.trim(), err = $('f_err');
      err.hidden = true;
      if (!file && !url) { err.hidden = false; err.textContent = 'Pick a video file or paste a direct link to one.'; return; }
      if (file && url) { err.hidden = false; err.textContent = 'One or the other, not both.'; return; }
      const stages = $('f_detect').checked ? 's0_ingest,s1_sampling,s2_detection,s3_tracking,s8_events' : '';
      const fd = new FormData();
      if (url) fd.append('video_url', url);
      fd.append('capture_mode', $('f_mode').value);
      fd.append('pitch_length', $('f_len').value || '105');
      fd.append('pitch_width', $('f_wid').value || '68');
      const kick = $('f_kick').value.trim();
      if (kick) { const [mm, ss] = kick.split(':').map(Number); fd.append('kickoff_offset_ms', String((mm * 60 + ss) * 1000)); }
      if ($('f_sm').value.trim()) fd.append('sm_match_id', $('f_sm').value.trim());
      if (stages) fd.append('stages', stages);
      const note = $('f_note');
      const busy = (on, text) => { $('f_go').disabled = on; $('f_prog').hidden = !on; note.hidden = !text; note.textContent = text || ''; };
      const failed = msg => { busy(false, ''); err.hidden = false; err.textContent = msg; };
      // Two requests: the details first (small), then the video streamed to
      // its own route, so the server writes it straight to disk as it
      // arrives and the progress bar is the real upload.
      busy(true, url ? 'Registering the match…' : `Registering the match for ${esc(file.name)}…`);
      fetch('/matches', { method: 'POST', body: fd }).then(async r => {
        if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
        return r.json();
      }).then(m => {
        if (!file) { busy(false, ''); $('add').reset(); refresh().catch(() => {}); return; }
        const xhr = new XMLHttpRequest();
        const q = new URLSearchParams({ filename: file.name });
        if (stages) q.set('stages', stages);
        xhr.open('PUT', `/matches/${encodeURIComponent(m.id)}/source?${q}`);
        xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');
        $('f_prog').value = 0;
        xhr.upload.onprogress = e => {
          if (!e.lengthComputable) return;
          $('f_prog').value = Math.round(100 * e.loaded / e.total);
          note.textContent = `Uploading ${gb(e.loaded)} of ${gb(e.total)}`;
        };
        xhr.upload.onload = () => { note.textContent = `All ${gb(file.size)} sent; the server is finishing the file…`; };
        xhr.onload = () => {
          if (xhr.status === 200) { busy(false, ''); $('add').reset(); refresh().catch(() => {}); }
          else failed(`The server refused the video: ${xhr.status} ${xhr.responseText.slice(0, 200)}`);
        };
        xhr.onerror = () => failed('The upload broke before the server answered. The match is listed as waiting for its video; add it again.');
        xhr.send(file);
      }).catch(e => failed(`The server refused it: ${e.message}`));
    });
    return;
  }

  function who(e) {
    const d = e.decision;
    const track = takerOf(e);
    const name = state.doc.track_names[String(track)] || (track === e.taker_track ? e.player_id : null);
    const roster = state.doc.roster || {};
    const label = name && roster[name] ? (roster[name].number != null ? `#${roster[name].number} ` : '') + (roster[name].name || name) : name;
    return label || (track ? `track ${track}` : 'nobody near');
  }
  function kindOf(e) { return e.decision && e.decision.verdict === 'wrong_type' ? e.decision.corrected_type : e.type; }
  // Kind and taker can both be wrong, so a corrected kind may carry a corrected taker beside it.
  function takerOf(e) {
    const d = e.decision;
    return d && (d.verdict === 'wrong_taker' || d.verdict === 'wrong_type') && d.corrected_track != null ? d.corrected_track : e.taker_track;
  }
  function said(d) { return d.verdict === 'wrong_type' && d.corrected_track != null ? 'wrong type + taker' : d.verdict.replace('_', ' '); }

  // The list narrows to one kind of event at a tap, by the name the list
  // shows: the pipeline's, or the reviewer's where she corrected it. The
  // choice rides in the address so a narrowed list can be reloaded or sent.
  const shown = e => !state.filter || kindOf(e) === state.filter;
  function firstShown() {
    const evs = state.doc.events;
    const open = evs.findIndex(e => shown(e) && !e.decision);
    return open >= 0 ? open : evs.findIndex(shown);
  }
  function setFilter(kind) {
    state.filter = kind;
    const u = new URL(location.href);
    if (kind) u.searchParams.set('kind', kind); else u.searchParams.delete('kind');
    history.replaceState(null, '', u);
    const cur = state.doc.events[state.i];
    const next = cur && shown(cur) ? -1 : firstShown();
    if (next >= 0) select(next); else renderList();
  }
  function renderKinds() {
    const evs = state.doc.events, counts = {};
    evs.forEach(e => { const k = kindOf(e); counts[k] = (counts[k] || 0) + 1; });
    // In the sport's own order, so the chips keep their places as kinds are corrected.
    const order = state.doc.event_types.filter(t => counts[t]).concat(Object.keys(counts).filter(t => !state.doc.event_types.includes(t)));
    if (state.filter && !order.includes(state.filter)) order.push(state.filter);
    const el = $('kinds'); el.innerHTML = '';
    el.hidden = order.length < 2 && !state.filter;
    const chip = (kind, label, n) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (state.filter === kind ? ' on' : '');
      b.setAttribute('aria-pressed', String(state.filter === kind));
      b.dataset.kind = kind || '';
      b.innerHTML = `${esc(label)}<small>${esc(n)}</small>`;
      b.addEventListener('click', () => setFilter(state.filter === kind ? null : kind));
      el.appendChild(b);
    };
    chip(null, 'all', evs.length);
    order.forEach(t => chip(t, t.replace('_', ' '), counts[t] || 0));
  }

  function renderList() {
    const el = $('events'); el.innerHTML = '';
    const evs = state.doc.events;
    const vis = evs.filter(shown);
    const own = vis.filter(e => e.decision && !e.decision.carried_from).length;
    const carried = vis.filter(e => e.decision && e.decision.carried_from).length;
    $('count').textContent = `${own}/${vis.length} reviewed` + (carried ? ` · ${carried} carried` : '');
    $('matchid').textContent = matchId.slice(0, 8);
    if (!evs.length) { fail('No events in this match yet. Run s8_events first.'); return; }
    renderKinds();
    $('empty').hidden = vis.length > 0;
    if (!vis.length) $('empty').textContent = 'No events of this kind. Tap "all" to see the rest.';
    evs.forEach((e, i) => {
      if (!shown(e)) return;
      const row = document.createElement('div');
      row.className = 'ev' + (i === state.i ? ' sel' : '');
      row.dataset.i = i;
      // A verdict given on an earlier run of the events and read through this one is drawn dashed.
      const from = e.decision && e.decision.carried_from;
      const badge = e.decision ? `<span class="badge ${esc(e.decision.verdict)}${from ? ' carried' : ''}"${from ? ` title="carried from events v${esc(from.events_version)}"` : ''}>${esc(said(e.decision))}</span>` : `<span class="badge">${esc(e.confidence)}</span>`;
      row.innerHTML = `<span class="clock">${esc(e.clock)}</span><span><div class="kind">${esc(kindOf(e).replace('_', ' '))}</div><div class="who">${esc(who(e))}</div></span>${badge}`;
      row.addEventListener('click', () => select(i));
      el.appendChild(row);
    });
    // Keep the selected row in view below the pinned header as j and k walk the list.
    el.parentElement.style.scrollPaddingTop = `${$('top').offsetHeight}px`;
    const sel = el.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  async function select(i) {
    stop();
    state.i = i;
    const e = state.doc.events[i];
    renderList();
    // Four seconds before the release and eight after. The time of an
    // event is when the ball was last seen at rest, and the kick or the
    // throw can come seconds later: a clip centred on it cut that off.
    const data = await api(`/matches/${matchId}/review/frames?t_ms=${e.t_ms + 2000}&span_s=6`);
    // Walking the list with j outruns the frames: an answer for an event
    // that is no longer the selected one must not draw over the one that is.
    if (state.i !== i) return;
    state.frames = data.frames; state.kinds = data.kinds; state.images.clear();
    // Start on the sample nearest the release, with the ones around it loading.
    let best = 0;
    state.frames.forEach((f, k) => { if (Math.abs(f.t_ms - e.t_ms) < Math.abs(state.frames[best].t_ms - e.t_ms)) best = k; });
    $('scrubber').max = Math.max(0, state.frames.length - 1);
    load(state.frames, e.t_ms);
    showFrame(best);
    document.querySelectorAll('#kindbtns button').forEach(b => b.classList.toggle('on', b.dataset.kind === kindOf(e)));
    $('caption').hidden = false;
    $('caption').innerHTML = `<span>${esc(e.clock)}</span><b>${esc(kindOf(e).replace('_', ' ').toUpperCase())}</b><span>${esc(who(e))}</span><span class="conf">${esc(e.confidence)}</span><span class="why">${esc(e.reason)}</span>`;
    const roster = state.doc.roster || {};
    const ids = Object.keys(roster);
    $('roster').hidden = $('name').hidden = !ids.length;
    if (ids.length) {
      $('roster').innerHTML = ids.map(id => `<option value="${esc(id)}">${roster[id].number != null ? '#' + esc(roster[id].number) + ' ' : ''}${esc(roster[id].name || id)}</option>`).join('');
    }
    state.pickTaker = false; $('hint').hidden = true; $('wrongtaker').classList.remove('on');
  }

  // Frames are fetched nearest the event first, so the moment itself can
  // be stepped through while the ends of the clip are still arriving.
  function load(frames, around) {
    [...frames].sort((a, b) => Math.abs(a.t_ms - around) - Math.abs(b.t_ms - around)).forEach(f => {
      if (!f.cached || state.images.has(f.frame_index)) return;
      const im = new Image(); im.src = f.url;
      im.onload = () => { if (state.frames[state.f] === f) draw(); };
      state.images.set(f.frame_index, im);
    });
  }
  // Five more seconds before or after, for the restart that takes its time.
  async function extend(dir) {
    const i = state.i, e = state.doc && state.doc.events[i];
    if (!e || !state.frames.length) return;
    const edge = dir < 0 ? state.frames[0].t_ms : state.frames[state.frames.length - 1].t_ms;
    const data = await api(`/matches/${matchId}/review/frames?t_ms=${edge + dir * 2600}&span_s=2.5`);
    if (state.i !== i) return;
    const have = new Set(state.frames.map(f => f.frame_index));
    const add = data.frames.filter(f => !have.has(f.frame_index));
    if (!add.length) return;
    const cur = state.frames[state.f];
    state.frames = state.frames.concat(add).sort((a, b) => a.t_ms - b.t_ms);
    $('scrubber').max = state.frames.length - 1;
    load(add, edge);
    // Earlier frames keep the place; later ones are what was asked to be seen, so step onto the first.
    showFrame(dir < 0 ? state.frames.indexOf(cur) : state.frames.indexOf(add[0]));
  }

  function showFrame(k) {
    state.f = Math.max(0, Math.min(state.frames.length - 1, k));
    $('scrubber').value = state.f;
    const f = state.frames[state.f];
    const e = state.doc.events[state.i];
    if (f) $('time').textContent = `${(f.t_ms / 1000).toFixed(1)} s  (${((f.t_ms - e.t_ms) / 1000).toFixed(1)})`;
    draw();
  }

  function draw() {
    const f = state.frames[state.f]; if (!f) return;
    const e = state.doc.events[state.i];
    const im = state.images.get(f.frame_index);
    const W = state.doc.match.width || 1920, H = state.doc.match.height || 1080;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (im && im.complete && im.naturalWidth) ctx.drawImage(im, 0, 0, W, H);
    const taker = takerOf(e);
    const lw = Math.max(1, W / 960);
    for (const b of f.boxes) {
      const kind = state.kinds[b.cls] || 'person';
      if (kind === 'object') {
        ctx.strokeStyle = '#FFDC00'; ctx.lineWidth = lw * 2;
        ctx.beginPath(); ctx.arc((b.x1 + b.x2) / 2, (b.y1 + b.y2) / 2, Math.max(6, (b.x2 - b.x1)) , 0, Math.PI * 2); ctx.stroke();
        continue;
      }
      const isTaker = b.track_id === taker;
      // Yellow is who took this event, the same player on every frame of
      // the clip. Green is who has the ball in this frame, and moves with
      // it; on the taker it is drawn inside the yellow so both show.
      const hasBall = kind === 'person' && f.has_ball != null && b.track_id === f.has_ball;
      ctx.strokeStyle = kind === 'landmark' ? '#E07BFF' : isTaker ? '#FFDC00' : hasBall ? '#5BE37D' : '#7FA3B8';
      ctx.lineWidth = isTaker || hasBall ? lw * 3 : lw;
      ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
      if (isTaker && hasBall) {
        ctx.strokeStyle = '#5BE37D';
        ctx.strokeRect(b.x1 + lw * 3, b.y1 + lw * 3, b.x2 - b.x1 - lw * 6, b.y2 - b.y1 - lw * 6);
      }
      ctx.fillStyle = ctx.strokeStyle; ctx.font = `${Math.max(11, W / 110)}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText(kind === 'landmark' ? b.cls : String(b.track_id), b.x1, Math.max(12, b.y1 - 4));
    }
  }

  function play() {
    if (state.playing || !state.frames.length) return;
    $('play').textContent = '❚❚';
    state.playing = setInterval(() => { if (state.f >= state.frames.length - 1) { stop(); return; } showFrame(state.f + 1); }, 200);
  }
  function stop() { if (state.playing) clearInterval(state.playing); state.playing = null; $('play').textContent = '▶'; }
  $('play').addEventListener('click', () => state.playing ? stop() : play());
  $('scrubber').addEventListener('input', ev => { stop(); showFrame(Number(ev.target.value)); });

  async function decide(verdict, extra = {}) {
    const e = state.doc.events[state.i]; if (!e) return;
    const body = { events_version: state.doc.events_version, t_ms: e.t_ms, verdict, decided_by: by(), ...extra };
    const d = await api(`/matches/${matchId}/review/decisions`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    e.decision = { verdict: d.verdict, corrected_type: d.corrected_type, corrected_track: d.corrected_track, decided_by: d.decided_by, decided_at: d.decided_at, carried_from: null };
    renderList();
    const next = state.doc.events.findIndex((x, k) => k > state.i && !x.decision && shown(x));
    if (next >= 0) select(next); else draw();
  }
  $('right').addEventListener('click', () => decide('right'));
  $('notevent').addEventListener('click', () => decide('not_event'));
  // Naming what it was is one tap or one digit, and so is tapping who
  // took it. Each keeps what was already said about the other, so an
  // event can have both its kind and its taker corrected; with the
  // pipeline's own kind and taker it is "right".
  function correct(kind, track) {
    const e = state.doc.events[state.i]; if (!e) return;
    const extra = {};
    if (kind !== e.type) extra.corrected_type = kind;
    if (track !== e.taker_track) extra.corrected_track = track;
    decide(extra.corrected_type ? 'wrong_type' : 'corrected_track' in extra ? 'wrong_taker' : 'right', extra);
  }
  function name(kind) { const e = state.doc.events[state.i]; if (e) correct(kind, takerOf(e)); }
  $('earlier').addEventListener('click', () => { stop(); extend(-1); });
  $('later').addEventListener('click', () => { stop(); extend(1); });
  $('wrongtaker').addEventListener('click', () => { state.pickTaker = !state.pickTaker; $('hint').hidden = !state.pickTaker; $('wrongtaker').classList.toggle('on', state.pickTaker); });
  canvas.addEventListener('click', ev => {
    if (!state.pickTaker) return;
    const r = canvas.getBoundingClientRect();
    const x = (ev.clientX - r.left) * canvas.width / r.width, y = (ev.clientY - r.top) * canvas.height / r.height;
    const f = state.frames[state.f]; if (!f) return;
    const hit = f.boxes.filter(b => (state.kinds[b.cls] || 'person') === 'person' && x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2)
      .sort((a, b) => (a.x2 - a.x1) * (a.y2 - a.y1) - (b.x2 - b.x1) * (b.y2 - b.y1))[0];
    if (!hit) return;
    state.pickTaker = false; $('hint').hidden = true; $('wrongtaker').classList.remove('on');
    correct(kindOf(state.doc.events[state.i]), hit.track_id);
  });
  $('name').addEventListener('click', async () => {
    const e = state.doc.events[state.i]; if (!e) return;
    const track = takerOf(e);
    if (!track) return;
    const pid = $('roster').value;
    await api(`/matches/${matchId}/review/tracks`, { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ tracks_version: state.doc.tracks_version, track_id: track, player_id: pid, decided_by: by() }) });
    state.doc.track_names[String(track)] = pid;
    renderList(); select(state.i);
  });
  document.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
    // j and k walk the events being shown, skipping the kinds filtered out.
    const step = dir => {
      const evs = state.doc ? state.doc.events : [];
      for (let k = state.i + dir; k >= 0 && k < evs.length; k += dir) if (shown(evs[k])) { select(k); return; }
    };
    if (ev.key === 'j') step(1);
    else if (ev.key === 'k') step(-1);
    else if (ev.key === 'ArrowRight') { stop(); showFrame(state.f + 1); }
    else if (ev.key === 'ArrowLeft') { stop(); showFrame(state.f - 1); }
    else if (ev.key === ' ') { ev.preventDefault(); state.playing ? stop() : play(); }
    else if (ev.key === '[') { stop(); extend(-1); }
    else if (ev.key === ']') { stop(); extend(1); }
    else if (ev.key >= '2' && ev.key <= '9' && state.doc && state.doc.event_types[Number(ev.key) - 2]) name(state.doc.event_types[Number(ev.key) - 2]);
    else if (ev.key === '1') decide('right');
    else if (ev.key === '0') decide('not_event');
  });

  api(`/matches/${matchId}/review`).then(doc => {
    state.doc = doc;
    doc.event_types.forEach((t, k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.kind = t;
      b.innerHTML = (k < 8 ? `<kbd>${k + 2}</kbd>` : '') + esc(t.replace('_', ' '));
      b.addEventListener('click', () => name(t));
      $('kindbtns').appendChild(b);
    });
    renderList();
    const first = firstShown();
    if (first >= 0) select(first);
  }).catch(err => fail(`Could not load the match: ${err.message}. Is this page served by the Sideline API (sideline serve) on your network?`));
})();
</script>
</body>
</html>
